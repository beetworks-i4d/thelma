# Editorial Candidate Schema v1.2
# Locked: 2026-05-25
#
# Candidates are cuttable editorial moments derived from atoms.
# A candidate may span one or more atoms.
#
# Core invariant:
# LLMs judge meaning. Scripts handle mechanics.
#
# Phase A deterministic:
# - creates candidate spans
# - assigns id, source, segment_ids, t, e, text
# - creates trim_choices
# - creates exclusion_choices
# - computes mechanical_boundary_safe
# - assigns deterministic cluster label
# - aggregates prosody
#
# Phase B LLM:
# - fills summary, distillation, usability, candidate_priority
# - fills suggested_narrative_roles
# - fills states, durability, confidence
# - evaluates content_preserved for every trim_choice
# - writes edit_notes
#
# Phase C deterministic:
# - validates schema
# - rejects invented IDs/timestamps
# - rejects broken references
# - produces loud errors

schema: editorial_candidate
version: "1.2"

candidate:
  required_fields:
    id:
      type: string
      format: "cand_NNN"
      description: Globally unique candidate ID assigned by Phase A.

    source:
      type: string
      description: Source filename or source key. Used to resolve library paths.

    segment_ids:
      type: array
      min_items: 1
      items: string
      description: Ordered atom seg_ids this candidate spans. Candidates may span multiple atoms.

    t:
      type: float
      description: Candidate outer start time in seconds, source-relative.

    e:
      type: float
      description: Candidate outer end time in seconds, source-relative.

    text:
      type: string
      description: Full transcript text covered by segment_ids. Never mutated.

    trim_choices:
      type: array
      min_items: 1
      description: Pre-generated trim pairings. Arrangement selects by trim choice ID, never by raw timestamp.
      items:
        required_fields:
          id:
            type: string
            format: "trim_NNN"
          in:
            type: float
            description: Trim start time. Generated by Phase A from word or silence boundary.
          out:
            type: float
            description: Trim end time. Generated by Phase A from word or silence boundary.
          label:
            type: string
            enum: [full_clean, tighter_start, tighter_end, both_tighter, minimal_trim]
          mechanical_boundary_safe:
            type: boolean
            description: Deterministic Phase A boundary-safety judgment.
          content_preserved:
            type: boolean
            nullable: true
            description: Phase B semantic-preservation judgment. Null until Phase B.

    exclusion_choices:
      type: array
      default: []
      description: Optional pre-generated internal exclusions. Arrangement selects by exclusion ID.
      items:
        required_fields:
          id:
            type: string
            format: "ex_NNN"
          start:
            type: float
          end:
            type: float
          type:
            type: string
            enum: [defect, pacing]
          reason:
            type: string
            enum: [long_pause, stumble, abandonment, false_start, trailing_off, low_energy_pause, dead_air]
          recommended:
            type: boolean

    summary:
      type: string
      max_words: 25
      description: Phase B summary of what the candidate says or does.

    distillation:
      type: string
      max_words: 5
      description: Phase B five-word semantic fingerprint.

    usability:
      type: string
      enum: [fine, marginal, unusable]
      description: Phase B judgment of candidate usability.

    candidate_priority:
      type: string
      enum: [primary, secondary, tertiary]
      description: Importance/centrality of the candidate. Not cut position.

    suggested_narrative_roles:
      type: array
      max_items: 3
      description: Phase B ranked suggestions only. Final narrative_role belongs in arrangement.
      items:
        required_fields:
          role:
            type: string
            enum: [hook, setup, continuation, payoff, transition, claim, evidence, definition, aside]
          confidence:
            type: string
            enum: [high, medium, low]

    states:
      type: array
      min_items: 1
      max_items: 3
      items:
        type: string
        enum: [vindication, outrage, awe, competence, fear, schadenfreude, amusement, catharsis, nostalgia, belonging, escape, calm, aspiration, sensual, curiosity]
      description: Phase B 15-state taxonomy labels. Primary state first.

    durability:
      type: string
      enum: [spike, mood, identity]
      description: Phase B durability tier.

    confidence:
      type: string
      enum: [high, medium, low]
      description: Phase B confidence in classification.

    cluster:
      type: string
      nullable: true
      description: Deterministic Phase A snake_case cluster label, or null. Advisory only.

    prosody:
      type: object
      description: Phase A aggregate prosody.
      required_fields:
        audio_profile:
          type: string
          enum: [casual, building, emphatic, landing, reflective, urgent, authoritative]
        energy:
          type: string
          enum: [low, medium, high]
        stumble_count:
          type: integer
        max_pause_ms:
          type: integer
        pitch_trend:
          type: string
          enum: [rising, falling, flat, level, varied]

  optional_fields:
    edit_notes:
      type: string
      description: Phase B debug notes. Not consumed by downstream scripts.

file_metadata:
  required_fields:
    version:
      type: string
      value: "1.2"
    input_fingerprint:
      type: string
    generated_at:
      type: string
    candidate_count:
      type: integer

validation:
  hard:
    - candidate.id must match cand_NNN
    - candidate.segment_ids must contain one or more valid seg_NNN references
    - candidate may span multiple atoms
    - candidate.t < candidate.e
    - every trim_choice.id must match trim_NNN
    - every trim_choice.in must be >= candidate.t
    - every trim_choice.out must be <= candidate.e
    - every trim_choice.in < trim_choice.out
    - every trim_choice must have mechanical_boundary_safe set
    - every trim_choice must have content_preserved set after Phase B
    - every exclusion_choice.id must match ex_NNN
    - every exclusion_choice.start/end must fall within candidate.t/e
    - every exclusion_choice.start < exclusion_choice.end
    - no exclusion_choice ranges may overlap within a candidate
    - states must contain 1 to 3 valid taxonomy values
    - states must not contain incompatible pairs
    - candidate_priority must be primary, secondary, or tertiary
    - durability must be spike, mood, or identity
    - confidence must be high, medium, or low
    - suggested_narrative_roles may not include close
    - suggested_narrative_roles may not include duplicate roles
    - cluster is null or snake_case string
    - LLM output may not invent timestamps or IDs

  soft:
    - candidates sharing a cluster should have at least one common state
    - Phase A recommended trim with content_preserved false should warn
    - candidate with no safe and content-preserved trim should be unusable

example_minimal_valid_candidate:
  id: cand_001
  source: "interview_01.mov"
  segment_ids: [seg_004, seg_005]
  t: 132.42
  e: 148.91
  text: "The thing about positioning is people think it's about being different."
  trim_choices:
    - id: trim_001
      in: 132.42
      out: 148.91
      label: full_clean
      mechanical_boundary_safe: true
      content_preserved: true
  exclusion_choices: []
  summary: "Positioning is about recognition, not difference"
  distillation: "positioning equals recognition"
  usability: fine
  candidate_priority: primary
  suggested_narrative_roles:
    - role: claim
      confidence: high
    - role: hook
      confidence: medium
  states: [competence, vindication]
  durability: identity
  confidence: high
  cluster: null
  prosody:
    audio_profile: emphatic
    energy: high
    stumble_count: 0
    max_pause_ms: 420
    pitch_trend: varied
  edit_notes: "Strong clean statement of the core thesis."
